name: Integrated Atlas Retail - Real Local Platform

on:
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "capstones/atlas-retail-integrated/**"
      - ".github/workflows/atlas-integrated.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrated-atlas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check pure data and retry invariants
        run: python -m unittest discover -s capstones/atlas-retail-integrated/tests -v

  real-stack:
    # Never run unknown external PR source in this Docker/network integration job.
    if: github.repository == 'Elghouali/engineering-apprenticeship' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate local Compose architecture
        run: docker compose -f capstones/atlas-retail-integrated/compose.yaml config --quiet
      - name: Actual Kafka, PostgreSQL, object store, HTTP and crash/replay smoke
        run: bash capstones/atlas-retail-integrated/ci/smoke.sh
      - name: Diagnostic container state on failure
        if: failure()
        run: |
          cd capstones/atlas-retail-integrated
          docker compose ps || true
          docker compose logs --tail=90 || true
      - name: Always destroy disposable integration volumes
        if: always()
        run: |
          cd capstones/atlas-retail-integrated
          docker compose --profile tools --profile api down -v --remove-orphans || true
  
  spark-postgres-objectstore:
    # Trusted maintainer pushes only. CI never processes third-party PR Dockerfiles.
    if: github.repository == 'Elghouali/engineering-apprenticeship' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Spark Compose wiring before launch
        run: docker compose -f capstones/atlas-retail-integrated/compose.yaml --profile spark config --quiet
      - name: Real PySpark computation over PostgreSQL snapshot and S3 artifact
        run: bash capstones/atlas-retail-integrated/ci/spark.sh
      - name: Inspect container state on failure
        if: failure()
        run: |
          cd capstones/atlas-retail-integrated
          docker compose --profile spark ps || true
          docker compose --profile spark logs --tail=70 || true
      - name: Delete all disposable Spark integration volumes
        if: always()
        run: |
          cd capstones/atlas-retail-integrated
          docker compose --profile tools --profile spark --profile api down -v --remove-orphans || true
  
  airflow-integrated-dag:
    # The local multi-container execution is a maintainer-only smoke job.
    if: github.repository == 'Elghouali/engineering-apprenticeship' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compose configuration
        run: docker compose -f capstones/atlas-retail-integrated/compose.yaml --profile airflow config --quiet
      - name: Airflow 3 Task SDK actually runs shared integrated platform
        run: bash capstones/atlas-retail-integrated/ci/airflow.sh
      - name: Inspect fault context
        if: failure()
        run: |
          cd capstones/atlas-retail-integrated
          docker compose --profile airflow ps || true
          docker compose --profile airflow logs --tail=100 || true
      - name: Always tear down synthetic containers and volumes
        if: always()
        run: |
          cd capstones/atlas-retail-integrated
          docker compose --profile airflow --profile tools --profile api down -v --remove-orphans || true
