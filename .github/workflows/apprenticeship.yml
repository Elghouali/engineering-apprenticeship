name: GitHub-Native Engineering Apprenticeship

on:
  push:
    branches:
      - main
      - "feat/**"
      - "mission/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: apprenticeship-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate mission contracts, dependencies and CLI
        run: python -m unittest discover -s tests -v
      - name: Show available assignments
        run: python tools/apprentice.py list

  submitted-missions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check learner submission (when present)
        run: |
          if [ -f submissions/retail-001/pipeline.py ]; then
            python tools/apprentice.py check retail-001
          else
            echo "No learner submission in this branch; mission remains ready."
          fi
